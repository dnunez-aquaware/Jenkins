<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Dashboard</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: grid;
    place-items: center;
    height: 100vh;
    margin: 0;
    background: #0f1720;
    color: #e6edf3;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p  { color: #8b9bb0; margin: 0; }
  #version { font-family: monospace; color: #3fb950; }
</style>
</head>
<body>
  <div>
    <h1>Cloud Infrastructure Dashboard</h1>
    <p>version <span id="version">...</span></p>
  </div>
<script>
  fetch("/api/info")
    .then(function (r) { return r.json(); })
    .then(function (i) { document.getElementById("version").textContent = "v" + i.version; });
</script>
</body>
</html>
