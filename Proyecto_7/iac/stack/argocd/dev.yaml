apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-dashboard-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dnunez-aquaware/Jenkins.git
    targetRevision: master
    path: Proyecto_6/iac/stack/envs/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
