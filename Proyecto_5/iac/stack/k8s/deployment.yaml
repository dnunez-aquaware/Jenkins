apiVersion: apps/v1
kind: Deployment #OBJETO QUE MANTIENE UN ESTADO DESEADO DE PODS
metadata:
  name: nginx
  namespace: default
spec:   # CONFIGURACION DESEADA DEL DEPLOYMENT
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template: # CONFIGURACION DE LOS PODS
    metadata:
      labels:
        app: nginx
    spec: # CONFIGURACION DESEADA DE LOS PODS
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80